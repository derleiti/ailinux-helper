name: AILinux Helper
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['apps/**', 'features/**', 'assets/**', '.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Helper release
    runs-on: ubuntu-24.04
    steps:
      - name: Create tagged prerelease shell
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --title "AILinux Helper ${GITHUB_REF_NAME#v}" \
              --notes "AILinux Helper ${GITHUB_REF_NAME#v}: live Android share rebinding, native resource advertisement, remote-compute preference, device-local Termux hardening, and typed desktop service control."
      - name: Branch build only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "No release upload for branch build."

  desktop:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            script: dist:linux
            name: linux
            release_glob: '*.AppImage *.deb'
          - os: windows-2025
            script: dist:win
            name: windows
            release_glob: '*.exe'
          - os: macos-15
            script: dist:mac
            name: macos
            release_glob: '*.dmg *.zip'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.script }} -- --publish never
      - name: Upload desktop packages directly to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=( ${{ matrix.release_glob }} )
          ((${#files[@]} > 0)) || { echo "No ${{ matrix.name }} packages produced" >&2; exit 1; }
          checksum="SHA256SUMS-${{ matrix.name }}.txt"
          if command -v sha256sum >/dev/null; then sha256sum "${files[@]}" | sort -k2 > "$checksum"; else shasum -a 256 "${files[@]}" | sort -k2 > "$checksum"; fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" "$checksum" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    needs: prepare-release
    runs-on: ubuntu-24.04
    env:
      AILINUX_ANDROID_KEYSTORE_B64: ${{ secrets.AILINUX_ANDROID_KEYSTORE_B64 }}
      AILINUX_ANDROID_STORE_PASSWORD: ${{ secrets.AILINUX_ANDROID_STORE_PASSWORD }}
      AILINUX_ANDROID_KEY_ALIAS: ${{ secrets.AILINUX_ANDROID_KEY_ALIAS }}
      AILINUX_ANDROID_KEY_PASSWORD: ${{ secrets.AILINUX_ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test Android helper
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Require production signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AILINUX_ANDROID_KEYSTORE_B64"
          test -n "$AILINUX_ANDROID_STORE_PASSWORD"
          test -n "$AILINUX_ANDROID_KEY_PASSWORD"
      - name: Configure Android release signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: printf '%s' "$AILINUX_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ailinux-release.jks"
      - name: Build signed Android release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AILINUX_ANDROID_KEYSTORE: ${{ runner.temp }}/ailinux-release.jks
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify and upload signed Android APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          AILINUX_ANDROID_KEYSTORE: ${{ runner.temp }}/ailinux-release.jks
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          expected_alias="${AILINUX_ANDROID_KEY_ALIAS:-ailinux-workspace}"
          keytool -list -v -keystore "$AILINUX_ANDROID_KEYSTORE" -alias "$expected_alias" -storepass "$AILINUX_ANDROID_STORE_PASSWORD" | grep -E 'Alias name:|SHA256:'
          out="AILinux-Helper-${GITHUB_REF_NAME#v}-android.apk"
          cp "$apk" "$out"
          sha256sum "$out" > SHA256SUMS-android.txt
          gh release upload "$GITHUB_REF_NAME" "$out" SHA256SUMS-android.txt --repo "$GITHUB_REPOSITORY" --clobber

  release-check:
    name: Verify Helper release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          printf '%s\n' "$assets"
          version="${GITHUB_REF_NAME#v}"
          escaped_version="${version//./\\.}"
          for pattern in \
            "^AILinux-Helper-${escaped_version}-linux-.*\.AppImage$" \
            "^AILinux-Helper-${escaped_version}-linux-.*\.deb$" \
            "^AILinux-Helper-${escaped_version}-win-.*\.exe$" \
            "^AILinux-Helper-${escaped_version}-mac-.*\.dmg$" \
            "^AILinux-Helper-${escaped_version}-android\.apk$" \
            '^SHA256SUMS-linux\.txt$' \
            '^SHA256SUMS-windows\.txt$' \
            '^SHA256SUMS-macos\.txt$' \
            '^SHA256SUMS-android\.txt$'; do
            grep -Eq "$pattern" <<<"$assets" || { echo "missing release asset matching: $pattern" >&2; exit 1; }
          done
      - name: Mark release ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
