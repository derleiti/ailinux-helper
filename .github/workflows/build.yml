name: AILinux Helper
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['apps/**', 'features/**', 'assets/**', '.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            script: dist:linux
            artifact: ailinux-helper-linux
            packages: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.deb
          - os: windows-2025
            script: dist:win
            artifact: ailinux-helper-windows
            packages: |
              apps/desktop/dist/*.exe
          - os: macos-15
            script: dist:mac
            artifact: ailinux-helper-macos
            packages: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.packages }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ailinux-helper-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Configure Android release signing
        if: ${{ secrets.AILINUX_ANDROID_KEYSTORE_B64 != '' && secrets.AILINUX_ANDROID_STORE_PASSWORD != '' && secrets.AILINUX_ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        env:
          AILINUX_ANDROID_KEYSTORE_B64: ${{ secrets.AILINUX_ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$AILINUX_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ailinux-release.jks"
      - name: Build signed Android release APK
        if: ${{ secrets.AILINUX_ANDROID_KEYSTORE_B64 != '' && secrets.AILINUX_ANDROID_STORE_PASSWORD != '' && secrets.AILINUX_ANDROID_KEY_PASSWORD != '' }}
        env:
          AILINUX_ANDROID_KEYSTORE: ${{ runner.temp }}/ailinux-release.jks
          AILINUX_ANDROID_STORE_PASSWORD: ${{ secrets.AILINUX_ANDROID_STORE_PASSWORD }}
          AILINUX_ANDROID_KEY_ALIAS: ${{ secrets.AILINUX_ANDROID_KEY_ALIAS }}
          AILINUX_ANDROID_KEY_PASSWORD: ${{ secrets.AILINUX_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Normalize signed Android release APK name
        if: ${{ secrets.AILINUX_ANDROID_KEYSTORE_B64 != '' && secrets.AILINUX_ANDROID_STORE_PASSWORD != '' && secrets.AILINUX_ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/AILinux-Helper-${GITHUB_REF_NAME#v}-android.apk"
      - uses: actions/upload-artifact@v4
        if: ${{ secrets.AILINUX_ANDROID_KEYSTORE_B64 != '' && secrets.AILINUX_ANDROID_STORE_PASSWORD != '' && secrets.AILINUX_ANDROID_KEY_PASSWORD != '' }}
        with:
          name: ailinux-helper-android-release
          path: apps/android/app/build/outputs/apk/release/AILinux-Helper-*-android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ailinux-helper-linux
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ailinux-helper-windows
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ailinux-helper-macos
          path: release-assets
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ailinux-helper-android-release
          path: release-assets
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "AILinux Helper ${GITHUB_REF_NAME#v}" \
            --notes "Cross-platform AILinux Helper ${GITHUB_REF_NAME#v}. Android production APK is signed and attached after certificate verification."
