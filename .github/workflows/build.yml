name: AILinux Helper
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['apps/**', 'features/**', 'assets/**', '.github/workflows/build.yml']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            script: dist:linux
          - os: windows-2025
            script: dist:win
          - os: macos-15
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/desktop/package-lock.json}
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ailinux-helper-${{ matrix.os }}
          path: apps/desktop/dist/*
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ailinux-helper-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
