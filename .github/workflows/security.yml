name: Security

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'apps/desktop/**'
      - 'release.json'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-webmcp:
    name: CodeQL WebMCP JavaScript
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
